<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ciclo de vida del proceso principal y sus hijos</title>
  <desc>Sin pausa, el proceso principal termina antes que las consultas y la máquina virtual detiene a los hijos sin que respondan. Con pausa, el principal espera y las dos tiendas alcanzan a responder.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: rgb(61, 61, 58); }
    .titulo { font-size: 14px; font-weight: 500; fill: rgb(20, 20, 19); }
    .centro { text-anchor: middle; }
    .derecha { text-anchor: end; }
    .tenue { fill: rgb(115, 114, 108); }
    .separador { stroke: rgb(115, 114, 108); stroke-width: 0.5; opacity: 0.2; }
    .eje { stroke: rgb(115, 114, 108); stroke-width: 1.5; fill: none; }
    .principal { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); stroke-width: 0.5; }
    .hijo { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); stroke-width: 0.5; }
    .perdido { fill: rgb(241, 239, 232); stroke: rgb(115, 114, 108); stroke-width: 0.5; stroke-dasharray: 4 3; }
    .corte { stroke: rgb(163, 45, 45); stroke-width: 1; stroke-dasharray: 4 3; }
    .fin-normal { fill: rgb(95, 94, 90); }
    .fin-cortado { fill: rgb(163, 45, 45); }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="rgb(115, 114, 108)"/>
    </marker>
  </defs>

  <!-- Sin pausa: las consultas tienen la misma duración que en el caso con pausa, pero se cortan en x=240 -->
  <text x="40" y="32" class="titulo">Sin pausa: el principal termina antes</text>

  <line x1="240" y1="54" x2="240" y2="178" class="corte"/>

  <text x="40" y="80">Principal</text>
  <rect x="120" y="64" width="120" height="24" rx="4" class="principal"/>
  <text x="180" y="80" class="centro">en ejecución</text>
  <circle cx="240" cy="76" r="5" class="fin-cortado"/>
  <text x="252" y="80">termina</text>

  <text x="40" y="120">Tienda A</text>
  <rect x="160" y="104" width="80" height="24" rx="4" class="hijo"/>
  <rect x="240" y="104" width="160" height="24" rx="4" class="perdido"/>
  <text x="320" y="120" class="centro tenue">no alcanza a responder</text>
  <circle cx="240" cy="116" r="4" class="fin-cortado"/>

  <text x="40" y="160">Tienda B</text>
  <rect x="200" y="144" width="40" height="24" rx="4" class="hijo"/>
  <rect x="240" y="144" width="280" height="24" rx="4" class="perdido"/>
  <text x="380" y="160" class="centro tenue">no alcanza a responder</text>
  <circle cx="240" cy="156" r="4" class="fin-cortado"/>

  <line x1="120" y1="196" x2="640" y2="196" class="eje" marker-end="url(#flecha)"/>
  <text x="630" y="214" class="derecha">tiempo</text>

  <line x1="40" y1="232" x2="640" y2="232" class="separador"/>

  <!-- Con pausa -->
  <text x="40" y="264" class="titulo">Con pausa: el principal espera a los hijos</text>

  <text x="40" y="306">Principal</text>
  <rect x="120" y="290" width="440" height="24" rx="4" class="principal"/>
  <text x="340" y="306" class="centro">en ejecución</text>
  <circle cx="560" cy="302" r="5" class="fin-normal"/>
  <text x="572" y="306">termina</text>

  <text x="40" y="346">Tienda A</text>
  <rect x="160" y="330" width="240" height="24" rx="4" class="hijo"/>
  <text x="280" y="346" class="centro">consulta y responde</text>
  <circle cx="400" cy="342" r="4" class="fin-normal"/>

  <text x="40" y="386">Tienda B</text>
  <rect x="200" y="370" width="320" height="24" rx="4" class="hijo"/>
  <text x="360" y="386" class="centro">consulta y responde</text>
  <circle cx="520" cy="382" r="4" class="fin-normal"/>

  <line x1="120" y1="422" x2="640" y2="422" class="eje" marker-end="url(#flecha)"/>
  <text x="630" y="440" class="derecha">tiempo</text>

  <text x="40" y="468">Cuando el principal termina, la máquina virtual se detiene con todos los hijos.</text>
</svg>
