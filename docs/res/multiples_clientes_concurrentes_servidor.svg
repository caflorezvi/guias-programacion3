<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dos ventas de frijol al mismo tiempo</title>
<desc>Dos cajeros envían casi al mismo tiempo una venta de 8 unidades de frijol a la sede. Los dos mensajes quedan en la cola del proceso :inventario. La sede atiende el primero, el frijol pasa de 8 a 0 y responde venta_ok al Cajero 1. Luego atiende el segundo, ya no hay existencias y responde error sin_existencias al Cajero 2.</desc>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #3D3D3A; }
  .c { text-anchor: middle; dominant-baseline: central; }
  .titulo { font-size: 14px; font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
  .peq { font-size: 11px; }
  .cajero { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .cajero-t { fill: #0C447C; }
  .cajero-s { fill: #185FA5; }
  .sede { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .sede-t { fill: #085041; }
  .sede-s { fill: #0F6E56; }
  .cola { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .msg { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .msg-t { fill: #633806; }
  .vida { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
  .envio { stroke: #185FA5; stroke-width: 1.2; fill: none; }
  .ok { stroke: #0F6E56; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  .error-t { fill: #A32D2D; }
  .error { stroke: #A32D2D; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
</style>
<defs>
  <marker id="punta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker>
  <marker id="punta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker>
  <marker id="punta-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A32D2D"/></marker>
</defs>

<!-- Participantes y líneas de vida -->
<line class="vida" x1="110" y1="70" x2="110" y2="390"/>
<line class="vida" x1="340" y1="70" x2="340" y2="390"/>
<line class="vida" x1="570" y1="70" x2="570" y2="390"/>

<rect class="cajero" x="40" y="20" width="140" height="50" rx="8"/>
<text class="c titulo cajero-t" x="110" y="38">Cajero 1</text>
<text class="c cajero-s" x="110" y="56">nodo cajero</text>

<rect class="sede" x="250" y="20" width="180" height="50" rx="8"/>
<text class="c titulo sede-t" x="340" y="38">Sede</text>
<text class="c sede-s" x="340" y="56">proceso :inventario</text>

<rect class="cajero" x="500" y="20" width="140" height="50" rx="8"/>
<text class="c titulo cajero-t" x="570" y="38">Cajero 2</text>
<text class="c cajero-s" x="570" y="56">nodo cajero</text>

<!-- Las dos ventas llegan casi al mismo tiempo -->
<text class="c mono cajero-s" x="222" y="90">{:vender, pid, "frijol", 8}</text>
<line class="envio" x1="110" y1="102" x2="338" y2="102" marker-end="url(#punta-azul)"/>
<text class="c mono cajero-s" x="458" y="98">{:vender, pid, "frijol", 8}</text>
<line class="envio" x1="570" y1="110" x2="342" y2="110" marker-end="url(#punta-azul)"/>

<!-- Cola de la sede -->
<rect class="cola" x="262" y="124" width="156" height="78" rx="8"/>
<text class="c peq" x="340" y="138" fill="#5F5E5A">cola de mensajes</text>
<rect class="msg" x="272" y="150" width="136" height="20" rx="4"/>
<text class="c peq msg-t" x="340" y="160">1 · venta del Cajero 1</text>
<rect class="msg" x="272" y="174" width="136" height="20" rx="4"/>
<text class="c peq msg-t" x="340" y="184">2 · venta del Cajero 2</text>

<!-- Atiende el primer mensaje -->
<rect class="sede" x="262" y="218" width="156" height="40" rx="6"/>
<text class="c sede-t" x="340" y="232">atiende el mensaje 1</text>
<text class="c sede-s" x="340" y="248">frijol: 8 → 0</text>

<text class="c mono sede-s" x="222" y="266">{:venta_ok, "frijol", 0}</text>
<line class="ok" x1="338" y1="278" x2="112" y2="278" marker-end="url(#punta-verde)"/>

<!-- Atiende el segundo mensaje -->
<rect class="sede" x="262" y="294" width="156" height="40" rx="6"/>
<text class="c sede-t" x="340" y="308">atiende el mensaje 2</text>
<text class="c sede-s" x="340" y="324">frijol: 0, no alcanza</text>

<text class="c mono error-t" x="458" y="342">{:error, :sin_existencias}</text>
<line class="error" x1="342" y1="354" x2="568" y2="354" marker-end="url(#punta-roja)"/>

<text class="c" x="340" y="414" font-style="italic">La sede atiende un mensaje a la vez, así que la primera venta termina antes de que empiece la segunda</text>
</svg>
