<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>File.read vs File.stream! comparados</title>
<desc>A la izquierda File.read carga todo el archivo en memoria de una sola vez. A la derecha File.stream! entrega líneas una a una bajo demanda, manteniendo la memoria mínima.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #3D3D3A; }
  .titulo { font-size: 14px; font-weight: 500; fill: #141413; }
  .cursiva { font-style: italic; }
  .inactiva rect { fill: none; stroke: #3B6D11; stroke-width: 0.75; stroke-dasharray: 3 2; }
  .inactiva text { fill: #3B6D11; }
  .inactiva { opacity: 0.4; }
</style>
<defs>
  <marker id="arrow-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker>
  <marker id="arrow-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="white"/>

<!-- Títulos -->
<text x="170" y="35" text-anchor="middle" class="titulo">File.read/1</text>
<text x="170" y="53" text-anchor="middle">carga todo el archivo en memoria</text>
<text x="510" y="35" text-anchor="middle" class="titulo">File.stream!/1</text>
<text x="510" y="53" text-anchor="middle">lee una línea bajo demanda</text>

<line x1="340" y1="20" x2="340" y2="355" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- ===== Izquierda: File.read/1 ===== -->
<rect x="40" y="80" width="100" height="200" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="100" text-anchor="middle" class="cursiva">archivo en disco</text>
<rect x="55" y="112" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="121" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 1</text>
<rect x="55" y="134" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="143" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 2</text>
<rect x="55" y="156" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="165" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 3</text>
<rect x="55" y="178" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="187" dominant-baseline="central" dy="-3" text-anchor="middle" fill="#0C447C">...</text>
<rect x="55" y="200" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="209" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea N</text>
<text x="90" y="240" text-anchor="middle">5 GB</text>

<line x1="198" y1="170" x2="142" y2="170" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow-gris)"/>
<text x="170" y="148" text-anchor="middle">pide</text>
<text x="170" y="162" text-anchor="middle">todo</text>
<line x1="142" y1="190" x2="198" y2="190" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow-gris)"/>
<text x="170" y="208" text-anchor="middle">entrega</text>
<text x="170" y="222" text-anchor="middle">todo</text>

<rect x="200" y="80" width="120" height="200" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="260" y="100" text-anchor="middle" fill="#791F1F">RAM</text>
<!-- File.read/1 devuelve un único binario, no líneas separadas -->
<rect x="210" y="112" width="100" height="106" rx="2" fill="#F09595" stroke="#A32D2D" stroke-width="0.5"/>
<text x="260" y="157" text-anchor="middle" dominant-baseline="central" fill="#501313">contenido</text>
<text x="260" y="173" text-anchor="middle" dominant-baseline="central" fill="#501313">completo (5 GB)</text>
<text x="260" y="240" text-anchor="middle" fill="#791F1F" class="cursiva">todo el archivo</text>
<text x="260" y="256" text-anchor="middle" fill="#791F1F" class="cursiva">cargado a la vez</text>

<text x="170" y="320" text-anchor="middle">memoria usada: 5 GB</text>
<text x="170" y="340" text-anchor="middle" fill="#A32D2D" class="cursiva">arriesgado con archivos grandes</text>

<!-- ===== Derecha: File.stream!/1 ===== -->
<rect x="380" y="80" width="100" height="200" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="430" y="100" text-anchor="middle" class="cursiva">archivo en disco</text>
<rect x="395" y="112" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="430" y="121" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 1</text>
<rect x="395" y="134" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="430" y="143" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 2</text>
<rect x="395" y="156" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#0F6E56" stroke-width="1.5"/>
<text x="430" y="165" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea 3</text>
<rect x="395" y="178" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="430" y="187" dominant-baseline="central" dy="-3" text-anchor="middle" fill="#0C447C">...</text>
<rect x="395" y="200" width="70" height="18" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="430" y="209" dominant-baseline="central" text-anchor="middle" fill="#0C447C">línea N</text>
<text x="430" y="240" text-anchor="middle">5 GB</text>

<line x1="543" y1="159" x2="482" y2="159" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-verde)"/>
<text x="511" y="151" text-anchor="middle" fill="#0F6E56">pide</text>
<line x1="482" y1="171" x2="543" y2="171" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-verde)"/>
<text x="511" y="186" text-anchor="middle" fill="#0F6E56">entrega 1</text>

<rect x="545" y="80" width="115" height="200" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="602" y="100" text-anchor="middle" fill="#27500A">RAM</text>
<!-- Las demás líneas no ocupan memoria: solo se marca su lugar -->
<g class="inactiva">
  <rect x="555" y="112" width="95" height="18" rx="2"/>
  <text x="602" y="121" dominant-baseline="central" text-anchor="middle">línea 1</text>
  <rect x="555" y="134" width="95" height="18" rx="2"/>
  <text x="602" y="143" dominant-baseline="central" text-anchor="middle">línea 2</text>
  <rect x="555" y="178" width="95" height="18" rx="2"/>
  <text x="602" y="187" dominant-baseline="central" dy="-3" text-anchor="middle">...</text>
  <rect x="555" y="200" width="95" height="18" rx="2"/>
  <text x="602" y="209" dominant-baseline="central" text-anchor="middle">línea N</text>
</g>
<!-- Línea que se está procesando -->
<rect x="555" y="156" width="95" height="18" rx="2" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="602" y="165" dominant-baseline="central" text-anchor="middle" fill="#173404">línea 3 (actual)</text>
<text x="602" y="240" text-anchor="middle" fill="#27500A" class="cursiva">solo una línea</text>
<text x="602" y="256" text-anchor="middle" fill="#27500A" class="cursiva">a la vez</text>

<text x="510" y="320" text-anchor="middle">memoria usada: unos pocos KB</text>
<text x="510" y="340" text-anchor="middle" fill="#3B6D11" class="cursiva">funciona con archivos de cualquier tamaño</text>

<!-- Conclusión -->
<text x="340" y="385" text-anchor="middle" class="cursiva">la memoria usada con stream es independiente del tamaño del archivo</text>
</svg>
