<svg width="100%" viewBox="0 0 680 462" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Concurrencia vs paralelismo</title>
  <desc>En concurrencia, un solo núcleo alterna entre tres tareas y todas avanzan durante el mismo periodo. En paralelismo, tres núcleos ejecutan las tres tareas en el mismo instante y terminan antes.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: rgb(61, 61, 58); }
    .titulo { font-size: 14px; font-weight: 500; fill: rgb(20, 20, 19); }
    .centro { text-anchor: middle; }
    .carril { stroke: rgb(115, 114, 108); stroke-width: 0.5; opacity: 0.3; }
    .separador { stroke: rgb(115, 114, 108); stroke-width: 0.5; opacity: 0.2; }
    .eje { stroke: rgb(115, 114, 108); stroke-width: 1.5; fill: none; }
    .fin { stroke: rgb(115, 114, 108); stroke-width: 1; stroke-dasharray: 3 3; }
    .t1 { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); stroke-width: 0.5; }
    .t2 { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); stroke-width: 0.5; }
    .t3 { fill: rgb(250, 236, 231); stroke: rgb(153, 60, 29); stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="rgb(115, 114, 108)"/>
    </marker>
  </defs>

  <!-- Concurrencia -->
  <text x="40" y="32" class="titulo">Concurrencia</text>
  <text x="40" y="50">Un núcleo alterna entre las tareas</text>

  <line x1="640" y1="62" x2="640" y2="108" class="fin"/>
  <text x="640" y="58" class="centro">fin</text>

  <text x="40" y="92">Núcleo 1</text>
  <line x1="100" y1="88" x2="640" y2="88" class="carril"/>
  <rect x="100" y="76" width="60" height="24" rx="4" class="t1"/><text x="130" y="92" class="centro">T1</text>
  <rect x="160" y="76" width="80" height="24" rx="4" class="t2"/><text x="200" y="92" class="centro">T2</text>
  <rect x="240" y="76" width="50" height="24" rx="4" class="t3"/><text x="265" y="92" class="centro">T3</text>
  <rect x="290" y="76" width="70" height="24" rx="4" class="t1"/><text x="325" y="92" class="centro">T1</text>
  <rect x="360" y="76" width="60" height="24" rx="4" class="t2"/><text x="390" y="92" class="centro">T2</text>
  <rect x="420" y="76" width="80" height="24" rx="4" class="t3"/><text x="460" y="92" class="centro">T3</text>
  <rect x="500" y="76" width="60" height="24" rx="4" class="t1"/><text x="530" y="92" class="centro">T1</text>
  <rect x="560" y="76" width="80" height="24" rx="4" class="t2"/><text x="600" y="92" class="centro">T2</text>

  <line x1="100" y1="120" x2="640" y2="120" class="eje" marker-end="url(#flecha)"/>
  <text x="370" y="140" class="centro">tiempo</text>

  <text x="40" y="170">En cada instante solo se ejecuta una tarea, pero todas están en curso.</text>

  <line x1="40" y1="200" x2="640" y2="200" class="separador"/>

  <!-- Paralelismo: cada barra mide lo mismo que la suma de sus tramos arriba -->
  <text x="40" y="232" class="titulo">Paralelismo</text>
  <text x="40" y="250">Cada núcleo ejecuta una tarea</text>

  <line x1="320" y1="262" x2="320" y2="388" class="fin"/>
  <text x="320" y="258" class="centro">fin</text>

  <text x="40" y="292">Núcleo 1</text>
  <line x1="100" y1="288" x2="640" y2="288" class="carril"/>
  <rect x="100" y="276" width="190" height="24" rx="4" class="t1"/><text x="195" y="292" class="centro">T1</text>

  <text x="40" y="332">Núcleo 2</text>
  <line x1="100" y1="328" x2="640" y2="328" class="carril"/>
  <rect x="100" y="316" width="220" height="24" rx="4" class="t2"/><text x="210" y="332" class="centro">T2</text>

  <text x="40" y="372">Núcleo 3</text>
  <line x1="100" y1="368" x2="640" y2="368" class="carril"/>
  <rect x="100" y="356" width="130" height="24" rx="4" class="t3"/><text x="165" y="372" class="centro">T3</text>

  <line x1="100" y1="400" x2="640" y2="400" class="eje" marker-end="url(#flecha)"/>
  <text x="370" y="420" class="centro">tiempo</text>

  <text x="40" y="448">Las tres tareas se ejecutan en el mismo instante, cada una en su núcleo, y terminan antes.</text>
</svg>
