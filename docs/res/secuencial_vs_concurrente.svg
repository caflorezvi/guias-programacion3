<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ejecución secuencial vs concurrente</title>
  <desc>En la ejecución secuencial las cinco consultas se hacen una tras otra y el total es 15 segundos. En la concurrente cada consulta corre en su propio proceso, todas empiezan a la vez y el total es 5 segundos, lo que tarda la tienda más lenta. Ambas partes usan la misma escala, 36 unidades por segundo.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: rgb(61, 61, 58); }
    .titulo { font-size: 14px; font-weight: 500; fill: rgb(20, 20, 19); }
    .total { font-size: 14px; fill: rgb(20, 20, 19); }
    .codigo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .centro { text-anchor: middle; }
    .marca-fin { fill: rgb(15, 110, 86); }
    .separador { stroke: rgb(115, 114, 108); stroke-width: 0.5; opacity: 0.2; }
    .eje { stroke: rgb(115, 114, 108); stroke-width: 1.5; fill: none; }
    .tick { stroke: rgb(115, 114, 108); stroke-width: 0.5; }
    .fin { stroke: rgb(15, 110, 86); stroke-width: 0.8; stroke-dasharray: 4 3; }
    .secuencial { fill: rgb(250, 236, 231); stroke: rgb(153, 60, 29); stroke-width: 0.5; }
    .concurrente { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="rgb(115, 114, 108)"/>
    </marker>
  </defs>

  <!-- Secuencial (1 s = 36 unidades) -->
  <text x="40" y="32" class="titulo">Ejecución secuencial</text>
  <text x="40" y="50"><tspan class="codigo">Enum.map</tspan> consulta una tienda tras otra</text>

  <rect x="80" y="68" width="36" height="22" rx="4" class="secuencial"/><text x="98" y="83" class="centro">A</text>
  <rect x="116" y="68" width="72" height="22" rx="4" class="secuencial"/><text x="152" y="83" class="centro">B</text>
  <rect x="188" y="68" width="108" height="22" rx="4" class="secuencial"/><text x="242" y="83" class="centro">C</text>
  <rect x="296" y="68" width="144" height="22" rx="4" class="secuencial"/><text x="368" y="83" class="centro">D</text>
  <rect x="440" y="68" width="180" height="22" rx="4" class="secuencial"/><text x="530" y="83" class="centro">E</text>

  <line x1="80" y1="110" x2="640" y2="110" class="eje" marker-end="url(#flecha)"/>
  <line x1="80" y1="106" x2="80" y2="114" class="tick"/><text x="80" y="128" class="centro">0 s</text>
  <line x1="116" y1="106" x2="116" y2="114" class="tick"/><text x="116" y="128" class="centro">1 s</text>
  <line x1="188" y1="106" x2="188" y2="114" class="tick"/><text x="188" y="128" class="centro">3 s</text>
  <line x1="296" y1="106" x2="296" y2="114" class="tick"/><text x="296" y="128" class="centro">6 s</text>
  <line x1="440" y1="106" x2="440" y2="114" class="tick"/><text x="440" y="128" class="centro">10 s</text>
  <line x1="620" y1="106" x2="620" y2="114" class="tick"/><text x="620" y="128" class="centro">15 s</text>

  <text x="80" y="158" class="total">Total: 15 s (suma de duraciones)</text>

  <line x1="40" y1="190" x2="640" y2="190" class="separador"/>

  <!-- Concurrente (misma escala) -->
  <text x="40" y="222" class="titulo">Ejecución concurrente</text>
  <text x="40" y="240">Cada consulta corre en su propio proceso y envía su precio al principal</text>

  <text x="40" y="284">A</text><rect x="80" y="268" width="36" height="22" rx="4" class="concurrente"/>
  <text x="40" y="312">B</text><rect x="80" y="296" width="72" height="22" rx="4" class="concurrente"/>
  <text x="40" y="340">C</text><rect x="80" y="324" width="108" height="22" rx="4" class="concurrente"/>
  <text x="40" y="368">D</text><rect x="80" y="352" width="144" height="22" rx="4" class="concurrente"/>
  <text x="40" y="396">E</text><rect x="80" y="380" width="180" height="22" rx="4" class="concurrente"/>

  <line x1="260" y1="262" x2="260" y2="410" class="fin"/>
  <text x="270" y="284" class="marca-fin">Llega el último precio</text>

  <line x1="80" y1="420" x2="640" y2="420" class="eje" marker-end="url(#flecha)"/>
  <line x1="80" y1="416" x2="80" y2="424" class="tick"/>
  <line x1="116" y1="416" x2="116" y2="424" class="tick"/>
  <line x1="152" y1="416" x2="152" y2="424" class="tick"/>
  <line x1="188" y1="416" x2="188" y2="424" class="tick"/>
  <line x1="224" y1="416" x2="224" y2="424" class="tick"/>
  <line x1="260" y1="416" x2="260" y2="424" class="tick"/>
  <text x="80" y="438" class="centro">0 s</text>
  <text x="260" y="438" class="centro">5 s</text>

  <text x="80" y="466" class="total">Total: 5 s (lo que tarda la tienda más lenta)</text>
</svg>
