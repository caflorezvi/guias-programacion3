<svg width="100%" viewBox="0 0 680 612" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Registro y búsqueda de inventarios con :global</title>
<desc>Cada sede registra su proceso de inventario con un nombre global. La tabla de nombres se sincroniza entre los nodos conectados. Un cajero conectado solo a la sede de Armenia busca :inventario_pereira en su copia local de la tabla y le envía el mensaje directamente a Pereira.</desc>
