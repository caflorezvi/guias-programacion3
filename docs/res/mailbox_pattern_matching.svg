<svg width="100%" viewBox="0 0 680 390" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cola de mensajes de la caja</title>
<desc>Tres emisores envían mensajes a la caja al mismo tiempo. Los mensajes se acumulan en orden en su cola y la caja los atiende uno a la vez con receive, así que el total pasa de 0 a 5000 y luego a 8000 sin que dos ventas se sumen a la vez.</desc>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #3D3D3A; }
  .c { text-anchor: middle; dominant-baseline: central; }
  .titulo { font-size: 14px; font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }
  .peq { font-size: 10px; }
  .envio { font-size: 11px; }
  .emisor { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .emisor-t { fill: #3C3489; }
  .emisor-s { fill: #534AB7; }
  .cola { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .msg { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .msg-activo { fill: #FAC775; stroke: #854F0B; stroke-width: 1.5; }
  .msg-t { fill: #633806; }
  .actor { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .actor-t { fill: #085041; }
  .actor-s { fill: #0F6E56; }
  .flecha { stroke: #73726C; stroke-width: 1; fill: none; }
</style>
<defs>
  <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#73726C"/></marker>
</defs>

<!-- Emisores: A arriba, B centrado con la cola, C abajo -->
<rect class="emisor" x="20" y="60" width="115" height="50" rx="8"/>
<text class="c titulo emisor-t" x="77.5" y="78">Emisor A</text>
<text class="c emisor-s" x="77.5" y="96">#PID&lt;0.50.0&gt;</text>

<rect class="emisor" x="20" y="150" width="115" height="50" rx="8"/>
<text class="c titulo emisor-t" x="77.5" y="168">Emisor B</text>
<text class="c emisor-s" x="77.5" y="186">#PID&lt;0.51.0&gt;</text>

<rect class="emisor" x="20" y="240" width="115" height="50" rx="8"/>
<text class="c titulo emisor-t" x="77.5" y="258">Emisor C</text>
<text class="c emisor-s" x="77.5" y="276">#PID&lt;0.52.0&gt;</text>

<!-- Mailbox -->
<rect class="cola" x="255" y="60" width="170" height="230" rx="10"/>
<text class="c titulo" x="340" y="82">Mailbox</text>
<text class="c" x="340" y="100" fill="#5F5E5A">cola en orden de llegada</text>

<rect class="msg-activo" x="270" y="118" width="140" height="40" rx="6"/>
<text class="c msg-t" x="340" y="132">{:sumar, 5000}</text>
<text class="c peq msg-t" x="340" y="148">1 · atendiendo</text>

<rect class="msg" x="270" y="166" width="140" height="40" rx="6"/>
<text class="c msg-t" x="340" y="180">{:sumar, 3000}</text>
<text class="c peq msg-t" x="340" y="196">2 · en espera</text>

<rect class="msg" x="270" y="214" width="140" height="40" rx="6"/>
<text class="c msg-t" x="340" y="228">{:total, #PID&lt;0.52.0&gt;}</text>
<text class="c peq msg-t" x="340" y="244">3 · en espera</text>

<text class="c" x="340" y="273" font-style="italic">cabeza de la cola arriba</text>

<!-- Envíos: cada flecha llega al mensaje que agrega a la cola -->
<line class="flecha" x1="135" y1="85" x2="268" y2="138" marker-end="url(#punta)"/>
<text class="envio" x="141" y="80">send {:sumar, 5000}</text>
<line class="flecha" x1="135" y1="175" x2="268" y2="186" marker-end="url(#punta)"/>
<text class="envio" x="141" y="168">send {:sumar, 3000}</text>
<line class="flecha" x1="135" y1="265" x2="268" y2="234" marker-end="url(#punta)"/>
<text class="envio" x="141" y="284">send {:total, self()}</text>


<!-- Caja (actor) -->
<rect class="actor" x="475" y="60" width="185" height="230" rx="10"/>
<text class="c titulo actor-t" x="567.5" y="82">Caja (actor)</text>
<text class="c actor-s" x="567.5" y="100">#PID&lt;0.60.0&gt;</text>

<rect class="actor" x="485" y="114" width="165" height="82" rx="6"/>
<text class="mono actor-t" x="495" y="132">receive do</text>
<text class="mono actor-s" x="511" y="150">{:sumar, valor} -&gt;</text>
<text class="mono actor-s" x="511" y="168">{:total, remitente} -&gt;</text>
<text class="mono actor-t" x="495" y="186">end</text>

<rect x="485" y="206" width="165" height="72" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text class="c actor-s peq" x="567.5" y="221">estado privado</text>
<text class="c titulo actor-t" x="567.5" y="241">total</text>
<text class="c actor-t" x="567.5" y="261">0 → 5000 → 8000</text>

<!-- La caja toma el mensaje de la cabeza de la cola -->
<line class="flecha" x1="412" y1="138" x2="484" y2="138" marker-end="url(#punta)"/>
<text class="c" x="450" y="128">atiende</text>

<!-- Conclusión -->
<rect class="cola" x="20" y="310" width="640" height="60" rx="8"/>
<text class="c titulo" x="340" y="332">La caja atiende un mensaje a la vez, aunque los emisores envíen en paralelo</text>
<text class="c" x="340" y="352" fill="#5F5E5A">ningún otro proceso puede modificar el total al mismo tiempo</text>
</svg>
