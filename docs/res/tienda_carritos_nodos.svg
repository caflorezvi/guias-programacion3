<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tienda con el GenServer Carritos</title>
<desc>El nodo tienda@localhost tiene un único proceso Carritos con el carrito de cada usuario. Tres clientes, cada uno en su propio nodo, le envían mensajes. Ana y Luis usan GenServer.call y reciben una respuesta. Sofía usa GenServer.cast para eliminar un producto y no recibe respuesta.</desc>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #3D3D3A; }
  .c { text-anchor: middle; dominant-baseline: central; }
  .titulo { font-size: 14px; font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }
  .peq { font-size: 11px; }
  .nodo-cliente { font-size: 10px; }
  .nodo { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .nodo-t { fill: #3C3489; }
  .nodo-s { fill: #534AB7; }
  .gs { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .gs-t { fill: #085041; }
  .gs-s { fill: #0F6E56; }
  .cliente { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .cliente-t { fill: #0C447C; }
  .cliente-s { fill: #185FA5; }
  .pide { stroke: #185FA5; stroke-width: 1.2; fill: none; }
  .responde { stroke: #0F6E56; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  .nota { fill: #5F5E5A; font-style: italic; }
</style>
<defs>
  <marker id="punta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker>
  <marker id="punta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker>
</defs>

<!-- Nodo de la tienda con el único proceso Carritos -->
<rect class="nodo" x="20" y="20" width="240" height="300" rx="12"/>
<text class="c titulo nodo-t" x="140" y="42">tienda@localhost</text>
<text class="c nodo-s" x="140" y="60">nodo de la tienda</text>

<rect class="gs" x="32" y="78" width="216" height="230" rx="8"/>
<text class="c titulo gs-t" x="140" y="118">Carritos (GenServer)</text>
<text class="c peq gs-s" x="140" y="138">estado: un carrito por usuario</text>
<text class="mono gs-t" x="42" y="172">%{</text>
<text class="mono gs-t" x="54" y="190">"ana" =&gt; %{"mouse" =&gt; 2,</text>
<text class="mono gs-t" x="114" y="206">"teclado" =&gt; 1},</text>
<text class="mono gs-t" x="54" y="224">"luis" =&gt; %{"monitor" =&gt; 1},</text>
<text class="mono gs-t" x="54" y="242">"sofia" =&gt; %{"audifonos" =&gt; 1}</text>
<text class="mono gs-t" x="42" y="260">}</text>

<!-- Clientes, cada uno en su propio nodo -->
<rect class="cliente" x="500" y="38" width="160" height="64" rx="8"/>
<text class="c titulo cliente-t" x="580" y="60">Cliente de Ana</text>
<text class="c nodo-cliente cliente-s" x="580" y="80">cliente_4f1a9c2e@localhost</text>

<rect class="cliente" x="500" y="148" width="160" height="64" rx="8"/>
<text class="c titulo cliente-t" x="580" y="170">Cliente de Luis</text>
<text class="c nodo-cliente cliente-s" x="580" y="190">cliente_9c2e7b10@localhost</text>

<rect class="cliente" x="500" y="258" width="160" height="64" rx="8"/>
<text class="c titulo cliente-t" x="580" y="280">Cliente de Sofía</text>
<text class="c nodo-cliente cliente-s" x="580" y="300">cliente_b7d03a55@localhost</text>

<!-- Ana: call, espera la respuesta -->
<text class="c mono cliente-s" x="380" y="52">call {:ver, "ana"}</text>
<line class="pide" x1="499" y1="62" x2="261" y2="62" marker-end="url(#punta-azul)"/>
<line class="responde" x1="261" y1="80" x2="499" y2="80" marker-end="url(#punta-verde)"/>
<text class="c mono gs-s" x="380" y="94">{:carrito, %{...}, 330000}</text>

<!-- Luis: call, espera la respuesta -->
<text class="c mono cliente-s" x="380" y="162">call {:agregar, "luis", "monitor", 1}</text>
<line class="pide" x1="499" y1="172" x2="261" y2="172" marker-end="url(#punta-azul)"/>
<line class="responde" x1="261" y1="190" x2="499" y2="190" marker-end="url(#punta-verde)"/>
<text class="c mono gs-s" x="380" y="204">{:agregado, "monitor"}</text>

<!-- Sofía: cast, no hay respuesta -->
<text class="c mono cliente-s" x="380" y="272">cast {:eliminar, "sofia", "mouse"}</text>
<line class="pide" x1="499" y1="282" x2="261" y2="282" marker-end="url(#punta-azul)"/>
<text class="c peq nota" x="380" y="300">sin respuesta</text>

<!-- Leyenda -->
<line class="pide" x1="40" y1="352" x2="68" y2="352" marker-end="url(#punta-azul)"/>
<text class="peq" x="76" y="356">mensaje del cliente (call o cast)</text>
<line class="responde" x1="290" y1="352" x2="318" y2="352" marker-end="url(#punta-verde)"/>
<text class="peq" x="326" y="356">respuesta, solo en el call</text>
<text class="nota" x="340" y="388" text-anchor="middle">Todos los mensajes van al mismo destino: <tspan class="mono" font-style="normal">{Carritos, :tienda@localhost}</tspan></text>
</svg>
