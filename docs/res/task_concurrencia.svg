<svg width="100%" viewBox="0 0 680 365" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Concurrencia con Task</title>
<desc>El proceso principal llama a Task.async una vez por tienda y las cinco consultas se ejecutan de forma concurrente, cada una en su propio proceso. Luego llama a Task.await una vez por tarea para recibir lo que retornó cada una y muestra la tienda más barata.</desc>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #3D3D3A; }
  .c { text-anchor: middle; dominant-baseline: central; }
  .titulo { font-size: 14px; font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
  .peq { font-size: 11px; }
  .res { font-size: 10.5px; }
  .principal { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .principal-t { fill: #0C447C; }
  .principal-s { fill: #185FA5; }
  .tarea { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .tarea-t { fill: #633806; }
  .tarea-s { fill: #854F0B; }
  .lanza { stroke: #185FA5; stroke-width: 1.2; fill: none; }
  .vuelve { stroke: #854F0B; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
</style>
<defs>
  <marker id="punta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker>
  <marker id="punta-cafe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#854F0B"/></marker>
</defs>

<!-- Proceso principal -->
<rect class="principal" x="20" y="20" width="640" height="40" rx="8"/>
<text class="c titulo principal-t" x="340" y="40">Proceso principal</text>

<!-- Una llamada a Task.async por tienda -->
<line class="lanza" x1="88" y1="60" x2="88" y2="119" marker-end="url(#punta-azul)"/>
<text class="mono principal-s" x="95" y="92">Task.async</text>
<line class="lanza" x1="214" y1="60" x2="214" y2="119" marker-end="url(#punta-azul)"/>
<text class="mono principal-s" x="221" y="92">Task.async</text>
<line class="lanza" x1="340" y1="60" x2="340" y2="119" marker-end="url(#punta-azul)"/>
<text class="mono principal-s" x="347" y="92">Task.async</text>
<line class="lanza" x1="466" y1="60" x2="466" y2="119" marker-end="url(#punta-azul)"/>
<text class="mono principal-s" x="473" y="92">Task.async</text>
<line class="lanza" x1="592" y1="60" x2="592" y2="119" marker-end="url(#punta-azul)"/>
<text class="mono principal-s" x="599" y="92">Task.async</text>

<!-- Las cinco tareas, cada una en su propio proceso, se ejecutan de forma concurrente -->
<rect x="20" y="108" width="640" height="112" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect class="tarea" x="27" y="120" width="122" height="88" rx="8"/>
<text class="c titulo tarea-t" x="88" y="136">Tienda A</text>
<text class="c peq tarea-s" x="88" y="153">1 segundo</text>
<text class="c mono tarea-t" x="88" y="172">consultar_precio</text>
<text class="c res tarea-s" x="88" y="192">→ {"Tienda A", 42000}</text>
<rect class="tarea" x="153" y="120" width="122" height="88" rx="8"/>
<text class="c titulo tarea-t" x="214" y="136">Tienda B</text>
<text class="c peq tarea-s" x="214" y="153">2 segundos</text>
<text class="c mono tarea-t" x="214" y="172">consultar_precio</text>
<text class="c res tarea-s" x="214" y="192">→ {"Tienda B", 18000}</text>
<rect class="tarea" x="279" y="120" width="122" height="88" rx="8"/>
<text class="c titulo tarea-t" x="340" y="136">Tienda C</text>
<text class="c peq tarea-s" x="340" y="153">3 segundos</text>
<text class="c mono tarea-t" x="340" y="172">consultar_precio</text>
<text class="c res tarea-s" x="340" y="192">→ {"Tienda C", 67000}</text>
<rect class="tarea" x="405" y="120" width="122" height="88" rx="8"/>
<text class="c titulo tarea-t" x="466" y="136">Tienda D</text>
<text class="c peq tarea-s" x="466" y="153">4 segundos</text>
<text class="c mono tarea-t" x="466" y="172">consultar_precio</text>
<text class="c res tarea-s" x="466" y="192">→ {"Tienda D", 25000}</text>
<rect class="tarea" x="531" y="120" width="122" height="88" rx="8"/>
<text class="c titulo tarea-t" x="592" y="136">Tienda E</text>
<text class="c peq tarea-s" x="592" y="153">5 segundos</text>
<text class="c mono tarea-t" x="592" y="172">consultar_precio</text>
<text class="c res tarea-s" x="592" y="192">→ {"Tienda E", 53000}</text>

<!-- Una llamada a Task.await por tarea -->
<line class="vuelve" x1="88" y1="208" x2="88" y2="269" marker-end="url(#punta-cafe)"/>
<text class="mono tarea-s" x="95" y="244">Task.await</text>
<line class="vuelve" x1="214" y1="208" x2="214" y2="269" marker-end="url(#punta-cafe)"/>
<text class="mono tarea-s" x="221" y="244">Task.await</text>
<line class="vuelve" x1="340" y1="208" x2="340" y2="269" marker-end="url(#punta-cafe)"/>
<text class="mono tarea-s" x="347" y="244">Task.await</text>
<line class="vuelve" x1="466" y1="208" x2="466" y2="269" marker-end="url(#punta-cafe)"/>
<text class="mono tarea-s" x="473" y="244">Task.await</text>
<line class="vuelve" x1="592" y1="208" x2="592" y2="269" marker-end="url(#punta-cafe)"/>
<text class="mono tarea-s" x="599" y="244">Task.await</text>

<!-- Proceso principal: muestra la respuesta -->
<rect class="principal" x="20" y="270" width="640" height="52" rx="8"/>
<text class="c titulo principal-t" x="340" y="288">Proceso principal</text>
<text class="c principal-s" x="340" y="307">La más barata es Tienda B con $18000</text>

<text class="c" x="340" y="346" font-style="italic">Las tareas dentro del recuadro punteado se ejecutan de forma concurrente, cada una en su propio proceso</text>
</svg>
