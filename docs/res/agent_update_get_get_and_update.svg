<svg width="100%" viewBox="0 0 680 935" role="img" xmlns="http://www.w3.org/2000/svg"><title>Operaciones de un Agent: update, get y get_and_update</title><desc>Dos clientes envían update al mismo tiempo y el Agent los aplica en orden. Luego un cliente lee el total con get, sin modificar el estado, y el otro cierra el turno con get_and_update, que responde el total y deja el estado en cero.</desc>
